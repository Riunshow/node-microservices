syntax = "proto3";

package Message;

service msgService {
  // 推送消息
  rpc pushMsg (msgReq) returns (msgRes);
  // 历史推送消息列表
  rpc msgListHistory (msgListReq) returns (msgListRes);
}

message msgReq {
  enum msgTypeEnum {
    text = 0;
    markdown = 1;
  }
  enum msgPushTypeEnum {
    feature = 0;
    release = 1;
    bugfix = 2;
  }

  int32 uid = 1;           // 当前人
  int32 gitlabProjectId = 2;             // gitlab project id
  msgPushTypeEnum msgPushType = 3;  // 通知类型, 参考 gitlab-webhook
  msgTypeEnum msgType = 4;          // 消息类型, 参考微信机器人
  string msg = 5;                   // 消息内容
}

message msgRes {
  string success = 1;
  string msg = 2;
}

message msgListReq {
  int32 pageNo = 1;
  int32 pageSize = 2;
}

message msgListRes {
  message msgList {
    int32 uid = 1;              // 当前人
    int32 gitlabProjectId = 2;        // gitlab project id
    string msgPushType = 3;      // 通知类型, 参考 gitlab-webhook
    string msgType = 4;          // 消息类型, 参考微信机器人
    string msg = 5;              // 消息内容
  }

  string success = 1;
  string msg = 2;
  repeated msgList list = 3;
}
